name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        # continue-on-error: the "brands" check only matters for submitting
        # to the default HACS store (requires an icon merged into
        # home-assistant/brands); it's not required to use this repo as a
        # HACS custom repository, and would otherwise fail on every run.
        continue-on-error: true
        with:
          category: integration
